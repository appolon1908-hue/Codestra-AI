name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: python -m compileall -q app scripts tests
      - run: pytest -q -m 'not postgres'
      - run: python scripts/validate_api_completion.py
      - run: python -c "from app.main import app, EXTERNAL_MODEL_CALLS_ENABLED; assert app; assert EXTERNAL_MODEL_CALLS_ENABLED is False"

  postgres-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codestra_ai_stage5
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codestra_ai_stage5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/codestra_ai_stage5
      POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/codestra_ai_stage5
      CODESTRA_ENVIRONMENT: test
      ALLOW_DEV_AUTH_BYPASS: 'true'
      EXTERNAL_MODEL_CALLS_ENABLED: 'false'
      TELEMETRY_EXPORT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: python scripts/certify_stage5_postgres.py
      - run: pytest -q -m postgres
